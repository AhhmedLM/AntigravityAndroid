name: Android ARM64 APK Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Official Antigravity CLI (android_arm64 v1.4.12)
        run: |
          mkdir -p app/src/main/assets/runtime
          curl -fsSL "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.4.12-4768735748292608/android-arm/cli_android_arm64.tar.gz" \
            -o app/src/main/assets/runtime/cli_android_arm64.agypkg

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug & Unsigned Release APKs (arm64-v8a)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AntigravityStudio-arm64-v8a-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk AntigravityStudio-arm64-v8a-release-unsigned.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityStudio-arm64-v8a-debug-apk
          path: AntigravityStudio-arm64-v8a-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AntigravityStudio-arm64-v8a-debug.apk
            AntigravityStudio-arm64-v8a-release-unsigned.apk
          name: Antigravity Studio ${{ github.ref_name }}
          body: |
            ## Antigravity Agent Studio for Android (${{ github.ref_name }})
            - Native on-device Antigravity CLI (`agy` v1.4.12) ARM64 ELF runtime.
            - Pure OLED Dark Theme adapted for Android mobile phones and tablets.
            - Background Engine Daemon (`AgentDaemonService`) with Foreground Notification.
            - Zero external Google AI API dependency — direct on-device Antigravity CLI execution.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
